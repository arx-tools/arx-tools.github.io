name: Build and deploy

# The site is a static build: `npm ci` and `npm run build` produce the whole thing in dist/,
# and that folder is uploaded to GitHub Pages as it is. There is no Jekyll step, no SSR and no
# runtime server - the same build runs on a laptop and here.
#
# The build reads nothing from the network besides npm: public/editor is the released build of
# the browser editor and public/schemas is the released set of schemas of arx-convert, both
# committed here by the release workflows of those repositories.
#
# main is the deployed state: it receives the release merges from dev and the artifact commits
# of the two other repositories, and this workflow is what turns it into the live site.

on:
  push:
    branches: ['main']

  # allows a re-deploy from the Actions tab, for example after a secret or a setting changed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and
# latest queued. Do not cancel in-progress runs: a production deployment should complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      # astro check && astro build, so a type error fails the deploy instead of shipping it
      - name: build
        run: npm run build

      - name: setup pages
        uses: actions/configure-pages@v6.0.0

      - name: upload the artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
